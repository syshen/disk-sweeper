[package]
name = "disk-sweeper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
jwalk = "0.8"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
